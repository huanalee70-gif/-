    8,
    "Gerald A. BeesonはCitadelの最高執行責任者（COO）です。COOとして、世界各地の主要なコーポレート機能を統括し、Citadelのポートフォリオ委員会のメンバーを務めています。2008年にCOOへ就任する以前は、Citadelの最高財務責任者を務めていました。大学在学中の1993年にCitadelに入社した、創業初期の社員の一人です。\n\nシカゴ大学でMBAを取得し、デポール大学で会計・財務を専攻して商学の学士号を取得しています。イリノイ州に公認会計士として登録されています。\n\nデポール大学の終身理事であり、元理事会議長です。また、Big Shoulders Fundの共同会長、Memorial Sloan Kettering Cancer Centerの評議員、Marist High Schoolの理事、Commercial Club of ChicagoのCivic Committeeの委員を務めています。アスペン研究所のAspen Global Leadership Networkに属する、2017年のHenry Crown Fellowsの一員です。",
